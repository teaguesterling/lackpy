[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lackpy-lang"
version = "0.13.0"
description = "The lackpy language: grammar, validator, grader, and spec — the pure-language leaf, with no runtime dependencies."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Teague Sterling" }]
# Wider floor than the lackpy runtime (>=3.11): the leaf is stdlib-only and uses no
# 3.11-only features, so consumers on 3.10 (e.g. kibitzer) can depend on it. NB: the
# shared CI matrix tests 3.11/3.12 — add a 3.10 leg if 3.10 must be guaranteed.
requires-python = ">=3.10"
dependencies = []

[project.urls]
Documentation = "https://lackpy.readthedocs.io"
Repository = "https://github.com/teaguesterling/lackpy"

[project.optional-dependencies]
dev = ["pytest>=8"]

# PEP 420 namespace package: src/lackpy/ has NO __init__.py — this dist contributes
# only the `lackpy.lang` subpackage to the shared `lackpy` namespace. The `lackpy`
# (runtime) dist contributes the rest and depends on this one.
[tool.hatch.build.targets.wheel]
packages = ["src/lackpy"]
