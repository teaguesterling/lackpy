name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_lang_only:
        description: "Build & publish ONLY lackpy-lang (out-of-band leaf release; lackpy core is skipped)"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        # Both namespace halves, editable. lackpy depends on lackpy-lang==<ver>, which
        # is not on PyPI until its own tag — installing the local lackpy-lang first
        # satisfies that pin from source.
        run: pip install -e ./packages/lackpy-lang -e ".[dev]"
      - name: Run tests
        # tests/eval imports scripts.prompt_eval (a dev-only harness, not packaged) and
        # ollama tests need a live model — both fail in CI; exclude them.
        run: pytest tests/ -v -m "not ollama" --ignore=tests/eval

  build:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install hatch
      - name: Build lackpy (core)
        # Skipped on a lang-only manual publish: lackpy core still carries the
        # woollama git-URL dependency, which PyPI rejects until woollama releases.
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publish_lang_only) }}
        run: hatch build
      - name: Build lackpy-lang
        # Emit lackpy-lang's sdist+wheel into the same dist/ so both are published
        # together — otherwise `pip install lackpy==X` can't resolve lackpy-lang==X.
        run: cd packages/lackpy-lang && hatch build ../../dist
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ┌─────────────────────────────────────────────────────────────────────────┐
  # │ ⚠️  BEFORE the first v0.12.0 tag: lackpy is now TWO dists (lackpy +        │
  # │ lackpy-lang) sharing the `lackpy` namespace, and lackpy pins              │
  # │ lackpy-lang==<ver>. The build job publishes BOTH wheels, but a NEW PyPI   │
  # │ project `lackpy-lang` with its own trusted-publisher (OIDC) must exist    │
  # │ first — otherwise the upload of lackpy-lang is rejected and               │
  # │ `pip install lackpy==0.12.0` breaks on the unresolvable dep.              │
  # │ Set up: https://pypi.org/manage/account/publishing/  (env: pypi)          │
  # └─────────────────────────────────────────────────────────────────────────┘
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Idempotent: a re-run — or this lang-only publish landing before the
          # eventual v0.12.0 bundle — must not fail on an already-present file.
          skip-existing: true
