[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lackpy"
version = "0.13.0"
description = "Python that lacks most of Python. Restricted program generation and execution for tool composition."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Teague Sterling" }]
requires-python = ">=3.11"
# lackpy is the runtime dist; lackpy-lang is the pure-language leaf. They share the
# `lackpy` namespace (PEP 420 — neither ships lackpy/__init__.py). Pinned so the two
# halves version together.
dependencies = [
    "markdown-it-py>=3.0",
    "lackpy-lang==0.12.0",   # the pure-language leaf (its own dist, also on PyPI)
    # woollama's model-management core (provides the `woollama.core` namespace):
    # provider/model routing, transport, recipe orchestration. Self-contained wheel,
    # no extra deps. lackpy uses only `woollama.core`, not the full woollama router.
    # Upper bound: woollama-core is pre-1.0 and fast-moving — cap the minor so a
    # breaking `complete()` change can't silently land. (A contract test guards the
    # signature within the allowed range; see tests/test_woollama_provider.py.)
    "woollama-core>=0.5.2,<0.6",
]

[project.optional-dependencies]
# Local + cloud model inference is built in now: model calls go through woollama
# (a core dependency, which brings httpx). No per-vendor SDK extras — pick the
# backend with a "<provider>/<model>" string in config. Cloud backends just need
# the relevant API key in the environment (ANTHROPIC_API_KEY, OPENAI_API_KEY, …).
# nsjail-python has no <3.12 wheel; marker keeps the project installable on 3.11
# (CI tests 3.11) while the sandbox extra is available on 3.12.
sandbox = ["nsjail-python ; python_version >= '3.12'"]
mcp = ["mcp[cli]"]
fledgling = ["fledgling"]
blq = ["blq-cli"]
kibitzer = ["kibitzer>=0.3"]
full = ["lackpy[sandbox,mcp,fledgling,blq,kibitzer]"]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
docs = [
    "mkdocs-material>=9",
    "mkdocstrings[python]>=0.24",
    "mkdocs-gen-files>=0.5",
    "mkdocs-literate-nav>=0.6",
]

[project.urls]
Documentation = "https://lackpy.readthedocs.io"
Repository = "https://github.com/teaguesterling/lackpy"

# For `uv` users, resolve the in-tree language leaf locally (editable) for monorepo
# dev instead of the published wheel. (woollama-core is a normal PyPI dependency.)
[tool.uv.sources]
lackpy-lang = { path = "packages/lackpy-lang", editable = true }

[project.scripts]
lackpy = "lackpy.cli:main"
lackpyctl = "lackpy.ctl:main"
lackpy-mcp = "lackpy.mcp.cli:mcp_main"

[tool.hatch.build.targets.wheel]
packages = ["src/lackpy"]

[tool.pytest.ini_options]
# Both namespace halves on the path: core runtime (src) + the lackpy-lang leaf.
pythonpath = ["src", "packages/lackpy-lang/src"]
asyncio_mode = "auto"
markers = [
    "ollama: requires a running Ollama instance",
    "slow: marks tests as slow (deselect with -m 'not slow')",
]
