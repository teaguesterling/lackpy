site_name: lackpy
site_description: Python that lacks most of Python. lackpy runs plain Python that a validator has checked.
site_url: https://lackpy.readthedocs.io

repo_url: https://github.com/teague/lackpy
repo_name: teague/lackpy

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - attr_list
  - def_list

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src, packages/lackpy-lang/src]
          options:
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            heading_level: 3
            members_order: source
            docstring_style: google
            merge_init_into_class: true
            show_if_no_docstring: false

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Tutorial: tutorial.md
  - Concepts:
    - Architecture: concepts/architecture.md
    - Language Spec: concepts/language-spec.md
    - File Access: concepts/paths.md
    - Profiles: concepts/profiles.md
    - Time Limits: concepts/time-limits.md
    - Inference Pipeline: concepts/inference.md
    - Interpreter Plugins: concepts/interpreters.md
    - Policy Layer: concepts/policy-layer.md
  - Extending:
    - Tool Providers: extending/tool-providers.md
    - Inference Providers: extending/inference-providers.md
    - Policy Sources: extending/policy-sources.md
    - Custom Rules: extending/custom-rules.md
    - LangChain Integration: extending/langchain.md
  - Design:
    - Direction (roadmap): design/direction.md
    - Tool Sources (RFC 0002): design/tool-sources.md
    - Kits → Profiles (RFC 0002 incr. 5): design/kits-to-profiles.md
    - Interpreter Types: design/interpreter-types.md
  - Reference:
    - Python API: reference/api.md
    - CLI: reference/cli.md
    - Style Guide: reference/style-guide.md
    - Former tools:
      - read_file: tools/read_file.md
      - write_file: tools/write_file.md
      - find_files: tools/find_files.md
      - edit_file: tools/edit_file.md

extra_css:
  - css/extra.css
